# Este archivo es una plantilla gestionada desde EUSTAT-DES/data.
# Se copia automáticamente a EUSTAT-PRE/data como deploy-to-staging.yml
# por el workflow deploy-to-pre.yml. NO editar directamente en PRE.

name: Deploy to staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Build data
      run: python scripts/build_data.py

    - name: Copy progreso.csv to repo root for versioning
      run: cp _site/progreso.csv progreso.csv

    - name: Copy progreso_indicadores.csv to repo root for versioning
      run: cp _site/progreso_indicadores.csv progreso_indicadores.csv

    - name: Copy progreso_metas.csv to repo root for versioning
      run: cp _site/progreso_metas.csv progreso_metas.csv

    - name: Copy progreso_metas_individual.csv to repo root for versioning
      run: cp _site/progreso_metas_individual.csv progreso_metas_individual.csv

    - name: Copy progreso_objetivos.csv to repo root for versioning
      run: cp _site/progreso_objetivos.csv progreso_objetivos.csv

    - name: Copy tabla_resumen.csv to repo root for versioning
      run: cp _site/tabla_resumen.csv tabla_resumen.csv

    - name: Check if there are any changes to files
      id: verify_diff
      run: |
        if [[ `git status -s` ]]; then
          echo "DIFF=true" >> "$GITHUB_OUTPUT"
        else
          echo "DIFF=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit files
      if: steps.verify_diff.outputs.DIFF == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "Add new progress measure updates"

    - name: Push changes
      if: steps.verify_diff.outputs.DIFF == 'true'
      uses: ad-m/github-push-action@master
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: ${{ github.ref }}

    - name: Place public files
      run: cp public/robots-staging.txt _site/robots.txt

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@3.7.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: _site
        CLEAN: true

    - name: Waiting 4 minutes for staging data deployment
      run: sleep 240

    # Disparar el rebuild de PRE/site para que construya con los CSV frescos
    - name: Rebuild PRE/site
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.token }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/EUSTAT-PRE/site/actions/workflows/deploy-to-staging.yml/dispatches \
          -d '{"ref":"develop"}'
