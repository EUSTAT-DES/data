definicion: |
  Nivel de implementación de las políticas de contratación pública sostenible (CPS).

  El indicador se calcula a través de un cuestionario del Programa de las Naciones Unidas para el 
  Medio Ambiente, que contiene 6 apartados: 

   - A: Existencia de una política, un plan de acción y/o unos requisitos reglamentarios en materia de CPS
   - B: Marco normativo de la contratación pública que favorece la CPS 
   - C: Apoyo práctico a los profesionales de la contratación pública en la aplicación de la CPS 
   - D: Criterios de contratación / normas de compra / requisitos de la CPS 
   - E: Existencia de un sistema de control de la CPS 
   - F: Proporción de compra sostenible de productos/servicios prioritarios  

formula: |
  $$P_{t} = PA_{t} \cdot  (PB_{t} + PC_{t} + PD_{t} + PE_{t} + PF_{t})$$

  donde:

  $PA_{t}$ = puntuación obtenida en el apartado A en el año $t$

  $PB_{t}$ = puntuación obtenida en el apartado B en el año $t$

  $PC_{t}$ = puntuación obtenida en el apartado C en el año $t$

  $PD_{t}$ = puntuación obtenida en el apartado D en el año $t$

  $PE_{t}$ = puntuación obtenida en el apartado E en el año $t$

  $PF_{t}$ = puntuación obtenida en el apartado F en el año $t$


desagregacion: >- 


periodicidad: FUENTE.FREQ_A3


observaciones: >-


