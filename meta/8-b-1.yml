definicion:  | 
  
  Eskuragarri dauden serieak: 

  <b> - Gazteen enplegua sustatzeko estrategia publikoen ezarpen maila:</b>
  Lanaren Nazioarteko Erakundeak ezarritako irizpideen arabera, gazteen enplegua sustatzeko estrategia publikoen ezarpenari dagokion puntuazioa (0 eta 3 artekoa)

  <b> - Administrazio publiko autonomikoek enplegua sustatzeko egindako gastua:</b>
  Administrazio autonomikoak enplegua sustatzeko egindako gastua (aurrekontu-likidazioetan erabilitako sailkapen funtzionalaren 24. gastu-politika) 
 
  <b> - Administrazio publiko autonomikoek enplegua sustatzeko egindako gastua, gastu guztiarekiko:</b>
  Administrazio autonomikoak enplegua sustatzeko egindako gastuaren proportzioa (aurrekontu-likidazioetan erabilitako sailkapen funtzionalaren 
  24. gastu-politika) 
 


formula:  |

  <b> Gazteen enplegua sustatzeko estrategia publikoen ezarpen maila</b> 

  $$GEE^{t}$$ 

  non: 

  $GEE^{t} =$ Lanaren Nazioarteko Erakundearen irizpideen arabera lortutako puntuazioa $t$ urtean 

  <br>

  <b> Administrazio publiko autonomikoek enplegua sustatzeko egindako gastua</b> 

  $$G_{enplegu\, sustapena}^{t}$$

  non: 

  $G_{enplegu\, sustapena}^{t} =$ autonomia erkidegoko aurrekontu bateratuen likidazioan enplegua sustatzeko gastua (sailkapen funtzionalaren 24. gastu-politika) $t$ urtean

  <br> 
  
  <b> Administrazio publiko autonomikoek enplegua sustatzeko egindako gastua, gastu guztiarekiko</b> 

  $$PG_{enplegu\, sustapena}^{t} = \frac{G_{enplegu\, sustapena}^{t}}{G^{t}} \cdot 100$$

  non:

  $G_{enplegu\, sustapena}^{t} =$ autonomia erkidegoko aurrekontu bateratuen likidazioan enplegua sustatzeko gastua (sailkapen funtzionalaren 24. gastu-politika) $t$ urtean

  $G^{t} =$ autonomia erkidegoko aurrekontu bateratuen likidazioko guztizko gastua $t$ urtean




desagregacion:  |

periodicidad: FUENTE.FREQ_A


observaciones: |

  Lanaren Nazioarteko Erakundeak ezarritako irizpideen araberako puntuazioen deskribapena:

    - Daturik ez: Ez dago behar adina informazio gazte enplegurako estrategiarik dagoen ebaluatzeko
    - 0: Herrialdeak ez du gazteen enplegurako inolako estrategia nazionalik garatu, eta ez du neurririk hartu estrategia hori garatu edo martxan jartzeko
    - 1: Herrialdea gazteentzako estrategia nazionala garatzeko prozesuan dago
    - 2: Herrialdeak gazte enplegurako estrategia nazionala garatu eta onartu du
    - 3: Herrialdeak gazteen enplegurako estrategia nazionala martxan jarri du


  Autonomia erkidegoetako aurrekontu-likidazioen datu bateratuak araztuta hartzen dira tokiko finantza-bitartekaritzatik 
  eta NPEtik (nekazaritza-politika erkidea)

texto_oceca: >- 

  "Administrazio publiko autonomikoek enplegua sustatzeko egindako gastua" eta "Administrazio publiko autonomikoek enplegua sustatzeko egindako gastua, gastu guztiarekiko" 
  seriak autonomia-erkidegoetako estatistika-organo nagusien arteko metodologia harmonizatua erabiliz kalkulatu dira



 # Metadatos mundiales (Descripción del indicador)  

justificacion_global: | 

  GJHen 8.b.1 adierazlearen helburua da herrialdeen aurrerapenaren azalpen bat ematea gazteen enpleguarekin 
  lotutako gaien ebazpenean. 

  Suposatzen da gazteen enplegurako estrategia egituratu gisa aitortu daitekeen hori ofizialki ezarrita, 
  herrialde batek arreta gehiago jarriko diela gazteen lan-merkatuaren erronkei, estrategiarik ez duten 
  herrialdeekin alderatuta. 

  Era horretarako estrategia bat garatzeak, gainera, sarritan alde interesdunen arteko partaidetza eta 
  kontsulta/koordinazio handia inplikatzen du. 


  Iturria: Nazio Batuen Estatistika Sekzioa 


dato_global: >-

comparabilidad: >- 
  EAEn eskuragarri dagoen adierazleak partzialki betetzen ditu Nazio Batuen adierazlearen metadatuak, eta informazio osagarria ematen du.

