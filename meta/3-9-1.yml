definicion: >-

   Partikula finen (PM2,5) 5 $\mu\mathrm{g}/\mathrm{m}^3$ baino kontzentrazio altuagoko esposizio luzeari egozgarriak diren heriotza goiztiarren tasa 100.000 biztanleko eta heriotza goiztiarren kopurua


formula: |

  <b>Partikula finekiko esposizioagatiko heriotza goiztiarren tasa 100.000 biztanleko</b>


  $$TM_{partikula }^{t} = \frac{D_{partikula }^{t}}{PA^{t}} \cdot 100.000$$
  

  <b>Partikula finekiko esposizioagatiko heriotza goiztiarren kopurua</b>

  $$D_{partikula }^{t}$$


  non:

  $D_{partikula }^{t} =$ partikulen esposizioari esleitutako heriotza goiztiar estimatuak, $t$ urtean

  $PA^{t} =$ biztanleria $t$ urtean

desagregacion: |
  Sexua 

  Lurralde historikoa

periodicidad: FUENTE.FREQ_A


observaciones: >-
  Heriotza goiztiarren kopurua kalkulatzeko, OMEren airearen kalitateari buruzko jarraibide orokorretan (2021) eta Europako Ingurumen Agentziak airearen kutsadurak osasunean dituen eraginei buruz 2025ean egindako informazio-saioan deskribatutako metodologia erabili da


# Metadatos mundiales (Descripción del indicador)  


justificacion_global: |

  Osasunerako arrisku-faktore nagusiak ebaluatzeko proiektu zabalago baten barruan, ingurumen-airearen (kanpokoa) 
  kutsadurarekiko esposizioaren ondoriozko hilkortasuna eta janaria prestatzeko erregai kutsatzaileen erabilerak 
  eragindako etxeko airearen kutsadura (barnekoa) ebaluatu ziren. 

  Ingurumen-airearen kutsadura industria-jardueraren, etxeen, automobilen eta kamioien emisioen emaitza da. Horiek 
  airearen kutsatzaileen nahasketa konplexuak dira, eta horietako asko osasunerako kaltegarriak dira. Kutsatzaile 
  horien guztien artean, partikula finek dute eraginik handiena gizakiaren osasunean. 

  Erregai kutsatzaileak dira zura, ikatza, animalia-simaurra, landare-ikatza eta laboreen hondakinak, bai eta kerosenoa 
  ere. Airearen kutsadura da osasunerako ingurumen arriskurik handiena. Kargaren zatirik handiena diru-sarrera txikiko 
  eta ertaineko herrialdeetako biztanleei dagokie. 


  Iturria: Nazio Batuen Estatistika Sekzioa 

comparabilidad: |

  EAEn eskuragarri dagoen adierazleak ez ditu Nazio Batuen adierazlearen metadatuak betetzen, baina antzeko informazioa ematen du.
  EAEn eskuragarri dagoen adierazlea Europako adierazlearekin aldera daiteke.



