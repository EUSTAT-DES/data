# Metadatos nacionales (ficha metodológica)
 
indicador_disponible: >-
  global_indicators.12-3-1-title

objetivo_global: objetivo_largo.12-titulo
meta_global: meta_largo.12-3-titulo
#  indicador_onu_global: indicador_largo.12-3-1-titulo


definicion: >-
  
  Available series:

  <b> - Food loss percentage:</b> 
  Food lost in the primary production and manufacturing stages, with respect to total food production. 

  <b> - Food waste:</b> 
  Amount of food wasted in retail, out-of-home consumption (restaurants, hotels, school-canteens...) and households
 
  <b> - Food waste per capita:</b>
  Amount of food wasted in retail, out-of-home consumption (restaurants, hotels, school-canteens...) and households, per inhabitant

formula: |

  <b> Food loss percentage</b> 

  $$FLP^{t} = \frac{FL_{primary\, production\, and\, manufacturing}^{t}}{{FP_{primary\, production\, and\, manufacturing}^{t}} \cdot 100$$ <br>

  where:

  $FL_{primary\, production\, and\, manufacturing}^{t} =$ food loss in primary production and manufacturing stages in year $t$  

  $FP_{primary\, production\, and\, manufacturing}^{t} =$ total food production in primary production and manufacturing stages in year $t$ 

  <br>

  <b> Food waste</b> 

  $$FW_{retail, out\, of\, home\, and\, households}^{t} = {FW_{retail}^{t} + FW_{out\, of\, home}^{t} + FW_{households}^{t}}$$ <br> 

  where:

  $FW_{retail}^{t} = $ food waste in retail in year $t$ 

  $FW_{out\, of\, home}^{t} = $ food waste in out-of-home consumption in year $t$ 

  $FW_{households}^{t} = $ food waste in households in year $t$ 

  <br>
  
  <b> Food waste per capita</b>

  $$FWPC_{retail, out\, of\, home\, and\, households}^{t} = \frac{FW_{retail}^{t} + FW_{out\, of\, home}^{t} + FW_{households}^{t}}{P^{t}}$$ <br> 

  where:

  $FW_{retail}^{t} = $ food waste in retail in year $t$ 

  $FW_{out\, of\, home}^{t} = $ food waste in out-of-home consumption in year $t$ 

  $FW_{households}^{t} = $ food waste in households in year $t$ 

  $P^{t} = $ population as of July 1 of year $t$



desagregacion: 

periodicidad:  

observaciones: >-

  Food includes both edible and inedible parts (e.g., fish bones).

  All food discarded as waste is considered loss or waste.


 # Metadatos mundiales (Descripción del indicador)  


justificacion_global: |
  The 2030 Sustainable Development Agenda has emphasized the importance of sustainable production 
  and consumption systems as efficient food systems, on the supply side and the consumption side, 
  contribute to food security and sustainability of natural resource since agriculture is a major 
  user of land and water. 

  The food loss and food waste index look at the entire supply chain and the trend in structural 
  losses. The Food Loss Index monitors progress on the supply side of food chains, as it measures 
  if the share of agriculture production that does not reach the retail stage in 2030 has increased 
  or decreased with respect to the base period and by how much. The numerator of the indicator 
  indicates the level of losses and informs on the magnitude of the problem. 

  A greater efficiency of the food supply chain also has implications for all producers whether 
  looking at efficiency in large-scale producers for export markets or in small-scale production 
  units relevant for poverty and food insecurity reduction goals. 

  According to a 2011 FAO publication, approximately one-third of all food is lost or wasted. This 
  generates economic losses and increases pressure on food systems. Reducing food waste is critical 
  to maximizing the value of agricultural land and ensuring that natural resources are used sustainably. 
  This indicator will not only help countries identify where food is lost and wasted, but can also 
  provide information that governments, citizens, and the private sector can use to reduce food waste.  

  Source: United Nations Statistics Division

