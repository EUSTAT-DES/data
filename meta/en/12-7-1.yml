definicion: |
  
  Level of implementation of sustainable public procurement (SPP) policies.

  The indicator is calculated using a questionnaire from the United Nations Environment Programme, 
  which contains 6 sections:

   - A: Existence of an SPP policy/action plan and/or SPP regulatory requirements 
   - B: The public procurement regulatory framework is conducive to SPP 
   - C: Practical support delivered to procurement practitioners in the implementation of SPP 
   - D: SPP purchasing criteria / buying standards / requirements 
   - E: Existence of an SPP monitoring system 
   - F: Percentage of sustainable public procurement 
 

formula: |

    
  $$P_{t} = PA_{t} \cdot  (PB_{t} + PC_{t} + PD_{t} + PE_{t} + PF_{t})$$ 

  where:

  $PA_{t}$ = A section score in year $t$ 

  $PB_{t}$ = B section score in year $t$ 

  $PC_{t}$ = C section score in year $t$ 

  $PD_{t}$ = D section score in year $t$ 

  $PE_{t}$ = E section score in year $t$ 

  $PF_{t}$ = F section score in year $t$ 

desagregacion: >- 


