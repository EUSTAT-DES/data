 # Metadatos nacionales (ficha metodológica)
 
indicador_disponible: >- 
  GRAFICO.8-b-1-titulo

objetivo_global: objetivo_largo.8-titulo
meta_global: meta_largo.8-b-titulo
#  indicador_onu_global: indicador_largo.8-b-1-titulo


definicion:  | 
  
  Available series: 

  <b> - Level of implementation of public strategies for youth employment:</b>
  Score on the implementation of public strategies to promote youth employment in accordance with the criteria established by the International Labour Organisation (0-3 points)

  <b> - Expenditure of the regional public administrations on employment promotion:</b>
  Expenditure of the regional public administrations on employment promotion (expenditure policy 
  24 of the functional classification used in the budgetary settlements of the autonomous communities)
 
  <b> - Proportion of the regional public administration's expenditure on employment promotion:</b>
  Expenditure of the regional public administrations on employment promotion as a percentage of total expenditure(expenditure policy 
  24 of the functional classification used in the budgetary settlements of the autonomous communities) 



formula:  |

  <b> Level of implementation of public strategies for youth employment</b> 

  $$IYES^{t}$$ 

  where: 

  $IYES^{t} =$ score obtained in accordance with the criteria of the International Labour Organisation in year $t$ 

  <br>

  <b> Expenditure of the regional public administrations on employment promotion</b> 

  $$G_{employment\, promotion}^{t}$$

  where: 

  $G_{employment\, promotion}^{t} =$ expenditure on employment promotion in the settlement of consolidated budgets of the autonomous community (expenditure policy 24 of the functional classification) in year $t$

  <br> 
  
  <b> Proportion of the regional public administration's expenditure on employment promotion</b> 

  $$PG_{employment\, promotion}^{t} = \frac{G_{employment\, promotion}^{t}}{G^{t}} \cdot 100$$

  where:

  $G_{employment\, promotion}^{t} =$ expenditure on employment promotion in the settlement of consolidated budgets of the autonomous community (expenditure policy 24 of the functional classification) in year $t$

  $G^{t} =$ total expenditure in the settlement of consolidated budgets of the autonomous community in year $t$



desagregacion:  |

periodicidad: FUENTE.FREQ_A


observaciones: >-

  Description of the scores according to the International Labour Organisation's criteria:

    - No data: No information available to assess the existence of a national strategy for youth employment
    - 0: The country has not developed any national strategy for youth employment or taken steps to develop or adopt one
    - 1: The country is in the process of developing a national strategy for youth employment
    - 2: The country has developed and adopted a national strategy for youth employment 
    - 3: The country has operationalised a national strategy for youth employment


  Consolidated data of the budgetary settlements of the autonomous communities are taken from IFL 
  (Local Financial Intermediation) and PAC (Common Agricultural Policy) 

texto_oceca: | 

  The series "Expenditure of the regional public administrations on employment promotion" and "Proportion of the regional public administration's expenditure on employment promotion" have 
  been compiled using a methodology harmonised among the central statistical bodies of the autonomous communities


 # Metadatos mundiales (Descripción del indicador)  

justificacion_global: | 

  The purpose of SDG indicator 8.b.1 is to provide an indication of the progress of countries in addressing 
  youth employment issues. 

  In this respect, it is assumed that having officially adopted what can be recognised as a structured 
  strategy for youth employment would mean larger attention given by a country to youth labour market 
  challenges, compared to countries with no strategy. 

  In fact, the development of such a strategy usually entails broad participation of and consultation/
  coordination among different stakeholders. 

  Source: United Nations Statistics Division

dato_global: >-

comparabilidad: >- 
  The available indicator partially complies with the metadata of the United Nations indicator, and provides complementary information.

