description: |
  Progress on the indicators and targets of the 2030 Agenda is evaluated on an ongoing basis, and the results of this monitoring are accessible on the page dedicated to each of the 17 Goals.
  
  This section summarizes the results of that evaluation, describing the progress made toward achieving the Sustainable Development Goals in the Autonomous Community of the Basque Country.
  
  The "Goals progress" section presents the status of each of the 17 Sustainable Development Goals; by clicking on the image for a specific goal, data on the progress of its associated targets and indicators is shown.
  
  The "Targets progress" section shows how many of the 169 targets that make up the 2030 Agenda fall into each of the progress categories, and allows for a more detailed view of the data by goal.
  
  The "Indicators progress" section shows the number of indicators at different stages of progress and allows for a more detailed view of the data by goal.
  
  To learn more about the methodology used to assess progress, see <a href="BASEURL/en/metodologia/">Measuring Progress on the Sustainable Development Goals</a>.
